agent_control_specification_version: 0.4.0-alpha.1
metadata:
  name: procurement-po_tool
policies:
  po_tool:
    type: rego
    bundle: ./policy/po_tool.rego
    query: data.procurement.po_tool.verdict
intervention_points:
  pre_tool_call:
    policy_target: $.tool_call.args
    policy_target_kind: tool_args
    tool_name_from: $.tool_call.name
    policy:
      id: po_tool
tools:
  read_document: {type: Tool, id: read_document}
  create_purchase_order: {type: Tool, id: create_purchase_order}
  send_email: {type: Tool, id: send_email}
