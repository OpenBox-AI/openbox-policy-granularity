[project]
name = "openbox-policy-granularity"
version = "0.1.0"
description = "How many OpenBox policies an agent needs: tool-level rules by default, input-level rules only where a value matters"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.0",
    "langchain-core>=1.3.3",
    "langgraph>=1.0.0",
    "openbox-langgraph-sdk-python>=1.1.0",
    "openbox-sdk-python>=1.4.0",
    "python-dotenv>=1.0.1",
    "cryptography>=43.0.0",
]

[tool.uv]
package = false
